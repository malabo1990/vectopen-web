site_name: Vectopen Docs
site_description: Manual de usuario de Vectopen, el editor vectorial libre hecho en Godot.
site_url: https://malabo1990.github.io/vectopen-web/docs/
repo_url: https://github.com/malabo1990/-Vectopen
repo_name: malabo1990/Vectopen
copyright: "&copy; 2025&ndash;2026 Casimiro Ondo Obiang (Malabo1990) &middot; MIT License"
edit_uri: https://github.com/malabo1990/vectopen-web/edit/main/docs/

docs_dir: docs
site_dir: site_build

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Manual de usuario de Vectopen, el editor vectorial libre hecho en Godot.
          nav_translations:
            Home: Inicio
            Getting Started: Primeros pasos
            Installation: Instalación
            Quick Start: Inicio rápido
            The Interface: La interfaz
            Tools: Herramientas
            Overview: Resumen
            Select: Selección
            Shapes: Formas
            Pen, Bézier & Nodes: Pluma, Bézier y nodos
            Text: Texto
            Brush: Pincel
            Hand & Navigation: Mano y navegación
            Objects: Objetos
            Layers: Capas
            Colour & Gradients: Color y degradados
            Effects, Filters & Shaders: Efectos, filtros y shaders
            Vectorize & AI: Vectorizar e IA
            Automation: Automatización
            Scripts & Add-ons: Scripts y complementos
            MCP Server (AI): Servidor MCP (IA)
            Files: Archivos
            Project Format (.vtc): Formato de proyecto (.vtc)
            Export & Import: Exportar e importar
            Keyboard Shortcuts: Atajos de teclado

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/malabo1990/-Vectopen

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - The Interface: getting-started/interface.md
  - Tools:
      - Overview: tools/index.md
      - Select: tools/selection-move.md
      - Shapes: tools/shapes.md
      - Pen, Bézier & Nodes: tools/pen-bezier.md
      - Text: tools/text.md
      - Brush: tools/brush.md
      - Hand & Navigation: tools/hand-navigation.md
  - Objects:
      - Layers: objects/layers.md
      - Colour & Gradients: objects/color-gradients.md
      - Effects, Filters & Shaders: objects/effects-filters-shaders.md
      - Vectorize & AI: objects/vectorize.md
  - Automation:
      - Scripts & Add-ons: automation/scripts-addons.md
      - MCP Server (AI): integrations/mcp-server.md
  - Files:
      - Project Format (.vtc): files/project-format.md
      - Export & Import: files/export-import.md
  - Keyboard Shortcuts: keyboard-shortcuts.md
